name: build-and-test

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SistemaTareas.slnx

      - name: Build
        run: dotnet build SistemaTareas.slnx --no-restore --configuration Release

      - name: Unit tests and coverage
        run: >-
          dotnet test tests/SistemaTareas.UnitTests
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage

      - name: Integration tests
        run: dotnet test tests/SistemaTareas.IntegrationTests --no-build --configuration Release

      - name: Architecture tests
        run: dotnet test tests/SistemaTareas.ArchitectureTests --no-build --configuration Release

      - name: Install Chromium
        shell: pwsh
        run: >-
          & "tests/SistemaTareas.SystemTests/bin/Release/net10.0/playwright.ps1"
          install --with-deps chromium

      - name: System test
        run: dotnet test tests/SistemaTareas.SystemTests --no-build --configuration Release

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage
